<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapport qualité partothèque</title><style>:root{--bg:#f7f1e6;--card:#fffaf1;--ink:#2d2430;--muted:#786d7e;--line:#ded2c0;--gold:#b68b2e;--red:#a74436;--blue:#365f91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.head{background:var(--card);border-bottom:1px solid var(--line)}h1{font-family:Georgia,serif;margin:0 0 6px;font-size:34px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi{background:white;border:1px solid var(--line);border-radius:10px;padding:14px}.v{font-family:Georgia,serif;font-size:30px;font-weight:700}.l{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}.btn,.tab{border:1px solid var(--blue);background:var(--blue);color:white;border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer}.tab{background:white;color:var(--ink);border-color:var(--line);font-size:12px}.tab.active{background:var(--ink);color:white}.tabs{display:flex;gap:8px;flex-wrap:wrap}.issue{background:white;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:10px;padding:12px;margin:9px 0}.issue.high{border-left-color:var(--red)}.issue.low{border-left-color:var(--blue)}.list{max-height:420px;overflow:auto;background:white;border:1px solid var(--line);border-radius:10px}.row{padding:10px 12px;border-bottom:1px solid #eee}.row:last-child{border-bottom:none}.bar{height:10px;background:#e8ddcb;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--gold)}.hidden{display:none}.help{background:#fff4d6;border:1px solid #ead8a4;border-radius:10px;padding:12px;margin-top:12px}</style></head><body><div class="head"><div class="wrap"><h1>🔎 Rapport qualité partothèque</h1><div class="muted">Lecture seule depuis GitHub Pages. Pour corriger, utilise <b>controle-qualite.html</b> en local.</div></div></div><main class="wrap"><div class="card"><button class="btn" id="reload">Recharger catalogue.json</button><div id="err" class="muted"></div></div><div id="app" class="hidden"><div class="card"><h2>État général</h2><div class="grid" id="kpis"></div><div class="help">Exploitation : corrige en local avec <b>controle-qualite.html</b>, régénère <b>catalogue.json</b>, puis commit/push.</div><div class="bar" style="margin-top:12px"><span id="scoreBar"></span></div></div><div class="card"><h2>Priorités</h2><div id="prio"></div></div><div class="card"><h2>Détail</h2><div class="tabs" id="tabs"></div><div id="detail"></div></div></div></main><script>(()=>{const F=[['conducteur',/conducteur|direction|score|chef/i],['trompette',/tromp|trp|tpette|bugle|cornet/i],['sax',/sax|alto|tenor|ténor|baryton/i],['trombone',/trombone|tbne|tb/i],['basse',/souba|basse|tuba/i],['clarinette',/clar|clari/i],['percu',/percu|batterie|drum|caisse|cymb/i],['flute',/flute|flûte|piccolo|picolo/i]];const S={files:[],songs:[],issues:{},score:0,tab:'all'};$=i=>document.getElementById(i);esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\.pdf$/,'').trim();fmt=n=>n>1048576?(n/1048576).toFixed(1)+' Mo':Math.round((n||0)/1024)+' Ko';name=f=>f.name||f.fileName||'';folder=f=>Array.isArray(f.folderPath)?f.folderPath.join(' / '):(f.folder||'');guess=n=>{let x=F.find(a=>a[1].test(n));return x&&x[0]};async function load(){try{let r=await fetch('catalogue.json',{cache:'no-store'});if(!r.ok)throw Error('catalogue.json introuvable');let d=await r.json();S.files=(Array.isArray(d)?d:(d.files||[])).map(f=>({...f,_name:name(f),_folder:folder(f),_part:guess(name(f)),_size:Number(f.size||0),_modified:f.modifiedTime||f.modified||f.lastModified}));analyze();render();$('app').classList.remove('hidden');$('err').textContent='';}catch(e){$('err').textContent=e.message}}function analyze(){let m=new Map();S.files.forEach(f=>{let k=f._folder||norm(f._name);if(!m.has(k))m.set(k,[]);m.get(k).push(f)});S.songs=[...m].map(([key,files])=>({key,title:key.split(' / ').pop(),files,parts:new Set(files.map(f=>f._part).filter(Boolean))}));let missingConductors=S.songs.filter(s=>!s.parts.has('conducteur')),unclassified=S.files.filter(f=>!f._part),large=S.files.filter(f=>f._size>10*1024*1024),old=S.files.filter(f=>{let d=new Date(f._modified);return !isNaN(d)&&Date.now()-d>730*86400000}),dups=[];S.songs.forEach(s=>{let mm=new Map();s.files.forEach(f=>{let k=norm(f._name).replace(/\s*\(copie\)|\s*copy|\s*\(\d+\)$/g,'');if(!mm.has(k))mm.set(k,[]);mm.get(k).push(f)});mm.forEach(g=>{if(g.length>1)dups.push({song:s.title,files:g})})});let lowCoverage=S.songs.filter(s=>s.parts.size>0&&s.parts.size<4);S.issues={missingConductors,unclassified,large,old,dups,lowCoverage};let sc=100;sc-=Math.min(25,missingConductors.length*2);sc-=Math.min(18,unclassified.length*1.5);sc-=Math.min(16,dups.length*4);sc-=Math.min(10,large.length);sc-=Math.min(8,old.length*.3);sc-=Math.min(12,lowCoverage.length);S.score=Math.max(0,Math.round(sc))}function k(l,v,h){return `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div><div class="muted">${h}</div></div>`}function issue(c,t,m){return `<div class="issue ${c}"><b>${t}</b><div class="muted">${m}</div></div>`}function render(){scoreBar.style.width=S.score+'%';kpis.innerHTML=k('Score',S.score+'/100',S.score>=85?'Correct':'À surveiller')+k('Morceaux',S.songs.length,'Groupés par dossier')+k('PDF',S.files.length,'catalogue.json')+k('Sans conducteur',S.issues.missingConductors.length,'prioritaire')+k('Non classés',S.issues.unclassified.length,'noms à corriger')+k('Doublons',S.issues.dups.length,'à vérifier');let p=[];if(S.issues.missingConductors.length)p.push(issue('high','Conducteurs manquants',S.issues.missingConductors.length+' morceaux'));if(S.issues.dups.length)p.push(issue('high','Doublons probables',S.issues.dups.length+' groupes'));if(S.issues.unclassified.length)p.push(issue('','PDF non classés',S.issues.unclassified.length+' fichiers'));if(!p.length)p.push(issue('low','Aucune priorité','Pas d’anomalie critique.'));prio.innerHTML=p.join('');let tabs=[['all','Tout'],['missingConductors','Sans conducteur'],['unclassified','Non classés'],['dups','Doublons'],['large','Lourds'],['old','Anciens'],['lowCoverage','Faible couverture']];$('tabs').innerHTML=tabs.map(t=>`<button class="tab ${S.tab==t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');detail()}function detail(){let row=(a,b)=>`<div class="row"><b>${esc(a)}</b><div class="muted">${esc(b||'')}</div></div>`,html='',add=(t,a,fn)=>{html+=`<h3>${t} (${a.length})</h3><div class="list">${a.length?a.slice(0,150).map(fn).join(''):'<div class="row">Aucun point détecté.</div>'}</div>`};if(S.tab=='all'||S.tab=='missingConductors')add('Sans conducteur',S.issues.missingConductors,s=>row(s.title,s.files.length+' PDF'));if(S.tab=='all'||S.tab=='unclassified')add('Non classés',S.issues.unclassified,f=>row(f._name,f._folder));if(S.tab=='all'||S.tab=='dups')add('Doublons',S.issues.dups,d=>row(d.song,d.files.map(f=>f._name).join(' · ')));if(S.tab=='all'||S.tab=='large')add('PDF lourds',S.issues.large,f=>row(f._name,fmt(f._size)+' · '+f._folder));if(S.tab=='all'||S.tab=='old')add('Anciens',S.issues.old,f=>row(f._name,new Date(f._modified).toLocaleDateString()+' · '+f._folder));if(S.tab=='all'||S.tab=='lowCoverage')add('Faible couverture',S.issues.lowCoverage,s=>row(s.title,[...s.parts].join(', ')));$('detail').innerHTML=html}document.body.addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){S.tab=b.dataset.tab;render()}});reload.onclick=load;load()})();</script></body></html>
